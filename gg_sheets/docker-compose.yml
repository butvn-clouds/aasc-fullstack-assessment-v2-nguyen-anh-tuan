services:
  sync-service:
    build: .
    container_name: bitrix24-sheets-sync
    restart: unless-stopped

    ports:
      - '${PORT:-3000}:${PORT:-3000}'

    env_file:
      - .env

    volumes:
      - ./config:/app/config
      - ./credentials:/app/credentials:ro
      - ./data:/app/data

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/admin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    profiles: ['tunnel']
    depends_on:
      sync-service:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ['http', 'sync-service:${PORT:-3000}']

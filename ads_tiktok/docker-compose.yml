services:
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "node dist/database/run-migrations.js && node dist/main.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  #   docker compose --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "app:3000"]
    depends_on:
      app: { condition: service_healthy }
    ports: ["127.0.0.1:4040:4040"]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}", POSTGRES_DB: leads }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:

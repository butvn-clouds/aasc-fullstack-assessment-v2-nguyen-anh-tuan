name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: integration_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run test:cov -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t ads-tiktok:ci .
      - name: Kiểm tra cấu hình compose production
        run: >-
          DB_PASSWORD=x REDIS_PASSWORD=x ADMIN_API_KEY=x TIKTOK_WEBHOOK_SECRET=x
          docker compose -f docker-compose.prod.yml config -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
